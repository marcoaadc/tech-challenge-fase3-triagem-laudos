version: 2
updates:
  # Bumps de versao maior (ex.: setup-python v5 -> v7) exigem revisao manual: so minor/patch automaticos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "build"
    groups:
      runtime:
        patterns: ["fastapi", "uvicorn", "pydantic*", "prometheus-client", "onnxruntime", "numpy", "scikit-learn", "joblib"]
      training:
        patterns: ["pandas", "skl2onnx", "onnx", "mlflow", "pyyaml"]
      dev:
        patterns: ["pytest*", "ruff", "httpx", "pre-commit"]

  # Imagens base: Python 3.10 e Airflow 2.10 sao decisoes do projeto (constraints e compatibilidade);
  # trocar de versao maior e uma mudanca planejada, nao automatica.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /airflow
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
