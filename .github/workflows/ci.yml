name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  POETRY_VERSION: "2.1.3"

# Actions fixadas por SHA (supply chain); o comentario indica a tag correspondente.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - name: Instalar dependencias
        run: poetry install --with train --no-interaction
      - name: Ruff check
        run: poetry run ruff check .
      - name: Ruff format (verificacao)
        run: poetry run ruff format --check .

  test:
    name: Testes (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Instalar dependencias
        run: poetry install --with train --no-interaction
      - name: Pytest com cobertura
        run: poetry run pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Publicar relatorio de cobertura
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  pipeline:
    name: Pipeline de treino (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - name: Instalar dependencias
        run: poetry install --with train --no-interaction
      - name: ingest -> train -> export -> promote -> benchmark
        env:
          TRIAGE_DATA_DIR: ci-run/data
          TRIAGE_MODELS_DIR: ci-run/models
          TRIAGE_REPORTS_DIR: ci-run/reports
        run: |
          poetry run python -m triage.pipelines.ingest --n-samples 6000
          poetry run python -m triage.pipelines.train
          poetry run python -m triage.pipelines.export
          poetry run python -m triage.pipelines.promote
          poetry run python -m triage.pipelines.benchmark --n-calls 300
      - name: Experimento em dataset publico (generalizacao)
        run: poetry run python scripts/experiment_public_dataset.py --cache-dir ci-run/external --reports-dir ci-run/reports
      - name: Publicar artefatos do pipeline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-reports
          path: |
            ci-run/reports/
            ci-run/models/metadata.json
            ci-run/models/registry.json

  dag-integrity:
    name: Integridade da DAG (Airflow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    env:
      AIRFLOW_VERSION: "2.10.5"
      AIRFLOW_HOME: /tmp/airflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar Airflow com constraints oficiais
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r airflow/requirements.txt --constraint "${CONSTRAINTS}"
          pip install --no-deps -e .
          pip install pytest
      - name: Validar DAG (import + estrutura)
        run: |
          airflow db migrate >/dev/null
          pytest -q tests/test_dag.py
          airflow dags list-import-errors --subdir airflow/dags
          airflow dags list --subdir airflow/dags | grep triage_training_pipeline

  docker:
    name: Build e smoke test da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validar docker-compose
        run: docker compose --profile airflow --profile load --profile mlflow config -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build da imagem da API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: triage-api:ci
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Subir container (1 worker) e testar endpoints
        run: |
          docker run -d --rm --name triage-ci -p 8000:8000 -e TRIAGE_API_KEY=ci-key triage-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d '{"texto":"x"}')" = "401"
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-key' \
            -d '{"texto":"Pneumotorax hipertensivo a esquerda. ACHADO CRITICO."}' | tee resposta.json
          grep -q '"classe":"urgente"' resposta.json
          curl -fsS -X POST -H 'X-API-Key: ci-key' http://localhost:8000/model/reload | grep -q '"status":"reloaded"'
          curl -fsS http://localhost:8000/metrics | grep -q 'triage_http_requests_total'
          docker logs triage-ci | tail -n 5
          docker stop triage-ci
      - name: Subir container (3 workers, metricas multiprocesso)
        run: |
          docker run -d --rm --name triage-ci-mp -p 8001:8000 -e TRIAGE_WORKERS=3 triage-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null -X POST http://localhost:8001/predict \
              -H 'Content-Type: application/json' -d '{"texto":"exame normal"}'
          done
          curl -fsS http://localhost:8001/metrics | grep 'triage_http_requests_total{method="POST",path="/predict",status="200"}' | tee mp.txt
          # Com 3 workers, o total agregado deve somar as 20 chamadas.
          awk '{ if ($2 + 0 < 20) exit 1 }' mp.txt
          docker logs triage-ci-mp | head -n 3
          docker stop triage-ci-mp
      - name: Tamanho da imagem
        run: docker image ls triage-api:ci --format 'imagem {{.Repository}}:{{.Tag}} = {{.Size}}'
      - name: Build da imagem do Airflow (validacao)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: airflow/Dockerfile
          push: false
          tags: triage-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Varredura de vulnerabilidades (imagem)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build da imagem (cache do job anterior)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: triage-api:ci
          cache-from: type=gha
      - name: Trivy (CVEs altas e criticas)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: triage-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
