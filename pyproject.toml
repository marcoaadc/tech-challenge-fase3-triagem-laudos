[project]
name = "triage"
version = "1.1.0"
description = "Triagem automatica de laudos medicos: classificador NLP servido via FastAPI com CI/CD, Airflow, Prometheus/Grafana e otimizacao ONNX"
authors = [{ name = "Marco", email = "marcoaadc@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "prometheus-client (>=0.20,<1.0)",
    "onnxruntime (>=1.18,<1.24)",
    "numpy (>=1.26,<3.0)",
    "scikit-learn (>=1.5,<1.8)",
    "joblib (>=1.4,<2.0)",
]

[project.scripts]
triage-api = "triage.api.main:run"

[tool.poetry]
packages = [{ include = "triage", from = "src" }]

[tool.poetry.group.train]
optional = true

[tool.poetry.group.train.dependencies]
pandas = ">=2.2,<3.0"
skl2onnx = ">=1.17,<2.0"
onnx = ">=1.16,<2.0"
mlflow = ">=2.14,<3.0"
pyyaml = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
ruff = ">=0.6"
httpx = ">=0.27,<1.0"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "models", "reports", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testes que treinam um modelo real (mais lentos)",
    "e2e: testes ponta a ponta que sobem a API com o modelo real",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/triage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
